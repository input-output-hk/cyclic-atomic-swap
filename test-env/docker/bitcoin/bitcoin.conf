# Bitcoin Core regtest configuration

# Network
regtest=1
[regtest]

# RPC Settings
server=1
# RPC authentication (supports both cookie and user/pass)
rpcuser=rpcuser
rpcpassword=rpcpassword
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0:18443

# ZMQ Settings - publish raw transactions and block hashes
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubhashblock=tcp://0.0.0.0:28333

# Blockchain Settings
txindex=1
fallbackfee=0.00001

# Logging
debug=1
printtoconsole=1

# Performance
dbcache=512
maxmempool=300

# Mining
[regtest]
# Allow zero-conf transactions
acceptnonstdtxn=1
