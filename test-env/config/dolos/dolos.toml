# Dolos v1.6.0 configuration. Note the shape differs from 1.0.x: the network
# magic moved from [upstream] to [chain], and storage is on schema v3.

[upstream]
peer_address = "cardano-node:3001"

[storage]
version = "v3"
path = "/data"
max_wal_history = 10000
max_chain_history = 10000

[genesis]
byron_path = "/shared/byron/genesis.json"
shelley_path = "/shared/shelley/genesis.json"
alonzo_path = "/shared/shelley/genesis.alonzo.json"
conway_path = "/shared/conway/genesis.conway.json"
force_protocol = 9

[chain]
type = "cardano"
magic = 42
is_testnet = true

[chain.track]
account_state = true
asset_state = true
pool_state = true
epoch_state = true
drep_state = true
proposal_logs = true
tx_logs = true
account_logs = true
pool_logs = true
epoch_logs = true

[sync]
pull_batch_size = 100

[submit]
prune_height = 200

# REST (Blockfrost-compatible) — the swap-daemon's Cardano REST endpoint
[serve.minibf]
listen_address = "[::]:50051"

# gRPC (UTxO RPC) — the swap-daemon's tx submission endpoint
[serve.grpc]
listen_address = "[::]:50052"

[logging]
max_level = "INFO"
