[package]
name = "cans_server"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1"
dashmap = "6"
ed25519-dalek = "2"
futures = "0.3"
musig2 =  "0.3.1"
pulsar = "6.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50.0", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = "0.3"
#ulid = { version = "1.2.1", features = ["serde"] }


